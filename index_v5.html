<!DOCTYPE html>
<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
🏝️ Okinawa Family Trip 2026
</title>

<style>

:root{
--ocean:#0284c7;
--sky:#e0f7ff;
--card:#ffffff;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Microsoft JhengHei",sans-serif;
background:#f5fbff;
color:#1e293b;
line-height:1.6;
}

.hero{
height:80vh;
background:
linear-gradient(
rgba(0,0,0,.35),
rgba(0,0,0,.45)
),
url('images/瀨長島.jpg');
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content{
max-width:700px;
}

.hero h1{
font-size:2.6rem;
margin-bottom:12px;
}

.hero p{
font-size:1.1rem;
margin-bottom:12px;
}

.badges{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin-top:15px;
}

.badge{
background:rgba(255,255,255,.2);
padding:8px 12px;
border-radius:30px;
backdrop-filter:blur(8px);
}

.countdown{
margin-top:25px;
font-size:1.6rem;
font-weight:bold;
}

.section{
padding:40px 20px;
max-width:1100px;
margin:auto;
}

.card{
background:white;
border-radius:20px;
padding:20px;
box-shadow:
0 10px 25px
rgba(0,0,0,.08);
margin-bottom:20px;
}

.scroll-cards{
display:flex;
overflow-x:auto;
gap:15px;
padding-bottom:10px;
}

.scroll-cards::-webkit-scrollbar{
display:none;
}

.small-card{
min-width:180px;
background:white;
padding:18px;
border-radius:18px;
box-shadow:
0 5px 15px
rgba(0,0,0,.08);
text-align:center;
}

.section-title{
font-size:28px;
color:#0369a1;
margin-bottom:20px;
}

@media(max-width:768px){

.hero{
height:70vh;
}

.hero h1{
font-size:2rem;
}

.countdown{
font-size:1.2rem;
}

}

</style>

</head>

<body>

<!-- Hero -->

<section class="hero">

<div class="hero-content">

<h1>
🏝️ Okinawa Family Trip
</h1>

<p>
2026.11.21 - 11.25
</p>

<div class="badges">

<div class="badge">
👨‍👩‍👧‍👦 13位家人
</div>

<div class="badge">
🏖️ 5天4夜
</div>

<div class="badge">
🚐 包車旅行
</div>

</div>

<div
id="countdown"
class="countdown">
載入中...
</div>

</div>

</section>

<!-- 行前提醒 -->

<section class="section">

<h2 class="section-title">
🛫 行前提醒
</h2>

<div class="card">

CI310 華航旅客：
07:30 前抵達台中國際機場

<br><br>

JX302 星宇旅客：
11:00 前抵達台中國際機場

</div>

</section>

<!-- 航班資訊 -->

<section class="section">

<h2 class="section-title">
✈️ 航班資訊
</h2>

<div class="scroll-cards">

<div class="small-card">
CI310<br>
09:45 → 12:15
</div>

<div class="small-card">
JX302<br>
13:15 → 15:45
</div>

<div class="small-card">
JX303<br>
16:45 → 17:35
</div>

</div>

</section>

<!-- 五日天氣 -->

<section class="section">

<h2 class="section-title">
🌤️ 沖繩五日天氣
</h2>

</section>

<!-- 景點 -->

<section class="section">

<h2 class="section-title">
📍 必訪景點
</h2>

</section>

<!-- 美食 -->

<section class="section">

<h2 class="section-title">
🍜 美食推薦
</h2>

</section>

<!-- 住宿 -->

<section class="section">

<h2 class="section-title">
🏨 住宿資訊
</h2>

</section>

<!-- 房間分配 -->

<section class="section">

<h2 class="section-title">
🏠 房間分配
</h2>

</section>

<!-- 行程 -->

<section class="section">

<h2 class="section-title">
📅 每日行程
</h2>

</section>

</body>

</html>
